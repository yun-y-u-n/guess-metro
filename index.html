<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜铁 - 猜猜隐藏地铁站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        /* 翻转动画 复刻原版Wordle效果 */
        @keyframes flipIn {
            0% { transform: rotateX(0); background: #fff; border-color: #cbd5e1; }
            45% { transform: rotateX(90deg); background: #fff; border-color: #cbd5e1; }
            55% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }
        .flip-cell {
            animation: flipIn 0.6s ease forwards;
        }
        /* 平滑过渡 */
        .cell {
            transition: all 0.3s ease;
        }
        /* 禁止选中 */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        /* 城市卡片悬停效果 */
        .city-card {
            transition: all 0.3s ease;
        }
        .city-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        correct: '#15803d',
                        partial: '#ca8a04',
                        wrong: '#94a3b8',
                        primary: '#2563eb',
                        text: '#0f172a',
                        light: '#f8fafc'
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-light text-text min-h-screen flex flex-col no-select">
    <!-- 城市选择界面 初始显示 -->
    <div id="city-select-screen" class="min-h-screen flex flex-col items-center justify-center px-4 py-12">
        <div class="max-w-2xl w-full">
            <div class="text-center mb-12">
                <h1 class="text-4xl md:text-5xl font-bold mb-4">猜糖</h1>
                <p class="text-xl text-gray-600">选择城市，开始挑战隐藏地铁站</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 天津卡片 -->
                <div class="city-card bg-white rounded-2xl p-8 border border-gray-200 cursor-pointer" onclick="selectCity('tianjin')">
                    <div class="text-5xl mb-4 bg-white"><img src="https://i.ibb.co/JRytFhgT/tj.png" alt="tj" border="0" width="60" height="60"></div>
                    <h2 class="text-2xl font-bold mb-2">天津</h2>
                    <p class="text-gray-600 mb-4">Tianjin Rail Transit</p>
                    <div class="flex items-center text-sm text-gray-500">
                        <span class="mr-4">🚇 14条线路</span>
                        <span>🚏 242个车站</span>
                    </div>
                </div>
                
                <!-- 青岛卡片 -->
                <div class="city-card bg-white rounded-2xl p-8 border border-gray-200 cursor-pointer" onclick="selectCity('qingdao')">
                    <div class="text-5xl mb-4"><img src="https://i.ibb.co/Xf0f9RrQ/qd.png" alt="qd" border="0" width="60" height="60"></div>
                    <h2 class="text-2xl font-bold mb-2">青岛</h2>
                    <p class="text-gray-600 mb-4">Qingdao Metro</p>
                    <div class="flex items-center text-sm text-gray-500">
                        <span class="mr-4">🚇 8条线路</span>
                        <span>🚏 172个车站</span>
                    </div>
                </div>

                <!-- 济南卡片 -->
                <div class="city-card bg-white rounded-2xl p-8 border border-gray-200 cursor-pointer" onclick="selectCity('jinan')">
                    <div class="text-5xl mb-4"><img src="https://i.ibb.co/jv9ysdDM/jn.png" alt="jn" border="0" width="60" height="60"></div>
                    <h2 class="text-2xl font-bold mb-2">济南</h2>
                    <p class="text-gray-600 mb-4">Jinan Rail Transit</p>
                    <div class="flex items-center text-sm text-gray-500">
                        <span class="mr-4">🚇 8条线路</span>
                        <span>🚏 153个车站</span>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-12 text-sm text-gray-500">
                <p>注：换乘次数和站点距离独立计算</p>
            </div>
        </div>
    </div>

    <!-- 游戏主界面 初始隐藏 -->
    <div id="game-screen" class="min-h-screen flex flex-col hidden">
        <!-- 顶部导航栏 适配多城市 -->
        <header class="w-full border-b border-gray-200 py-4 px-4 md:px-6">
            <div class="max-w-3xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <!-- 返回城市选择按钮 -->
                    <button onclick="backToCitySelect()" class="text-gray-500 hover:text-primary transition-all">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold" id="game-title">猜铁北京</h1>
                        <p class="text-sm text-gray-500" id="level-desc">闯关模式 - 猜出当前关卡隐藏地铁站</p>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-lg font-semibold" id="guess-count">0/6</div>
                    <p class="text-sm text-gray-500" id="level-progress">第 1 关 / 共 15 关</p>
                </div>
            </div>
        </header>

        <!-- 核心游戏区域 -->
        <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-6 flex flex-col">
            <!-- 规则提示 -->
            <div class="text-center text-sm text-gray-500 mb-6">
                注：换乘次数和站点距离独立计算
            </div>

            <!-- 猜测结果网格 核心UI -->
            <div class="w-full mb-8" id="guess-grid">
                <!-- 表头 -->
                <div class="grid grid-cols-12 gap-2 mb-3 text-sm font-medium text-gray-600 px-1">
                    <div class="col-span-3 text-left">站点</div>
                    <div class="col-span-2 text-center">行政区</div>
                    <div class="col-span-3 text-center">线路</div>
                    <div class="col-span-1 text-center">距离</div>
                    <div class="col-span-1 text-center">换乘</div>
                    <div class="col-span-2 text-center">投用时间</div>
                </div>
                <!-- 6次猜测行 动态填充 -->
                <div id="guess-rows" class="flex flex-col gap-2"></div>
            </div>

            <!-- 输入区域 -->
            <div class="mt-auto w-full">
                <div class="flex gap-2 w-full">
                    <input 
                        type="text" 
                        id="station-input" 
                        placeholder="输入地铁站名 按回车提交" 
                        class="flex-1 px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-base"
                        autocomplete="off"
                    >
                    <button 
                        id="submit-btn" 
                        onclick="submitGuess()"
                        class="px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 transition-all active:scale-95 disabled:bg-gray-300 disabled:cursor-not-allowed disabled:active:scale-100"
                    >
                        猜 测
                    </button>
                    
                    <button 
                        id="giveup-btn" 
                        onclick="giveUp()"
                        class="px-4 py-3 bg-red-500 text-white font-medium rounded-lg hover:bg-red-600 transition-all active:scale-95 disabled:bg-gray-300 disabled:cursor-not-allowed disabled:active:scale-100"
                    >
                        放弃
                    </button>
                </div>
                <!-- 模式切换入口 -->
                <div class="flex justify-center gap-4 mt-4 text-sm text-gray-500">
                    <button onclick="switchMode('challenge')" class="hover:text-primary transition-all" id="mode-challenge">闯关模式</button>
                    <span>|</span>
                    <button onclick="switchMode('free')" class="hover:text-primary transition-all" id="mode-free">自由模式</button>
                    <span>|</span>
                    <button onclick="switchMode('custom')" class="hover:text-primary transition-all" id="mode-custom">自定义</button>
                </div>
            </div>
        </main>
    </div>

    <!-- 结果弹窗 -->
    <div id="result-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4 shadow-2xl">
            <h2 class="text-2xl font-bold mb-2" id="modal-title">恭喜通关本关🎉</h2>
            <p class="text-gray-600 mb-4" id="modal-desc">本关隐藏站点：<span class="font-semibold text-correct" id="modal-answer"></span></p>
            <div class="mb-6" id="modal-stats">
                <p>你用了 <span class="font-semibold" id="modal-guess-count">0</span> 次猜测</p>
                <p class="text-sm text-gray-500 mt-1" id="modal-level-progress">当前进度：第 1 关 / 共 15 关</p>
            </div>
            <div class="flex gap-3 flex-wrap" id="modal-buttons">
                <!-- 闯关模式按钮组 -->
                <button id="modal-next-level" class="flex-1 py-2 bg-primary text-white rounded-lg font-medium hover:bg-primary/90 transition-all">下一关</button>
                <button id="modal-retry-level" class="flex-1 py-2 bg-amber-600 text-white rounded-lg font-medium hover:bg-amber-700 transition-all hidden">重玩本关</button>
                <button id="modal-restart-challenge" class="flex-1 py-2 bg-gray-200 rounded-lg font-medium hover:bg-gray-300 transition-all">重新闯关</button>
                <!-- 自由/自定义模式按钮 -->
                <button id="modal-retry-free" class="flex-1 py-2 bg-primary text-white rounded-lg font-medium hover:bg-primary/90 transition-all hidden">再来一局</button>
                <button id="modal-close" class="flex-1 py-2 bg-gray-200 rounded-lg font-medium hover:bg-gray-300 transition-all hidden">关闭</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
    <script src="data.js"></script>
</body>
</html>
